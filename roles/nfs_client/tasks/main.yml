---
- name: Install NFS client package
  ansible.builtin.apt:
    name: nfs-common
    state: present
    update_cache: true

- name: Ensure developers group exists
  ansible.builtin.group:
    name: developers
    gid: "{{ developers_gid }}"
    state: present

- name: Ensure NFS test user exists
  ansible.builtin.user:
    name: nfsuser
    groups: developers
    append: true
    create_home: true
    state: present

- name: Mount NFS exports
  ansible.posix.mount:
    path: "{{ item.mount_point }}"
    src: "{{ nfs_client_nfs_server }}:{{ item.export }}"
    fstype: nfs
    opts: defaults
    state: mounted
  loop: "{{ nfs_client_nfs_mounts }}"
