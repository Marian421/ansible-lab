---
- name: Install Prometheus
  ansible.builtin.apt:
    name: "{{ prometheus_package }}"
    state: present
    update_cache: true
  notify: Restart Prometheus

- name: Deploy Prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_config }}"
    owner: root
    group: prometheus
    mode: "0644"
  notify: Restart Prometheus

- name: Create Prometheus rules directory
  ansible.builtin.file:
    path: /etc/prometheus/rules
    state: directory
    owner: prometheus
    group: prometheus
    mode: '0755'

- name: Install Prometheus alert rules
  ansible.builtin.template:
    src: create-prometheus-rules.yml.j2
    dest: /etc/prometheus/rules/alert_rules.yml
    owner: prometheus
    group: prometheus
    mode: '0644'
    validate: 'promtool check rules %s'
  notify: Restart Prometheus

- name: Ensure Prometheus is enabled and started
  ansible.builtin.systemd:
    name: "{{ prometheus_service }}"
    enabled: true
    state: started
