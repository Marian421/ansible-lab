---
- name: Ensure healthcheck user exists
  ansible.builtin.user:
    name: "{{ healthcheck_user }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin

- name: Install healthcheck script
  ansible.builtin.template:
    src: lab-healthcheck.sh.j2
    dest: "{{ healthcheck_script }}"
    owner: root
    group: root
    mode: '0755'

- name: Install healthcheck systemd service
  ansible.builtin.copy:
    src: lab-healthcheck.service
    dest: "/etc/systemd/system/{{ healthcheck_service }}"
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload and restart healthcheck service

- name: Install healthcheck systemd timer
  ansible.builtin.copy:
    src: lab-healthcheck.timer
    dest: "/etc/systemd/system/{{ healthcheck_timer }}"
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload and restart healthcheck timer

- name: Ensure healthcheck timer is enabled and running
  ansible.builtin.systemd_service:
    name: "{{ healthcheck_timer }}"
    enabled: true
    state: started

- name: Show storage server message
  ansible.builtin.debug:
    msg: "This is the storage server"
  when: "'storage' in group_names"

- name: Show server role
  ansible.builtin.debug:
    msg: "This server's role is {{ server_role }}"
