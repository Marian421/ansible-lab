---

# The Grafana APT repository comes from the grafana_apt_repo dependency (meta/main.yml).

- name: Install Grafana
  ansible.builtin.apt:
    name: grafana
    state: present
  notify: Enable and start Grafana

- name: Configure Prometheus datasource
  ansible.builtin.template:
    src: prometheus-datasource.yml.j2
    dest: "{{ grafana_datasource_configuration_file_path }}"
    owner: root
    group: grafana
    mode: '0640'
  notify: Restart Grafana
