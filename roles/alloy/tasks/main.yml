---

# The Grafana APT repository comes from the grafana_apt_repo dependency (meta/main.yml).

- name: Create Alloy configuration directory
  ansible.builtin.file:
    path: "{{ alloy_configuration_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install Alloy
  ansible.builtin.apt:
    name: alloy
    state: present
    update_cache: true

- name: Create Alloy configuration
  ansible.builtin.template:
    src: alloy-configuration.yml.j2
    dest: "{{ alloy_configuration_file }}"
    owner: root
    group: root
    mode: '0644'
  notify: Restart Alloy

- name: Enable and start Alloy
  ansible.builtin.systemd_service:
    name: alloy
    enabled: true
    state: started
