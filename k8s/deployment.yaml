apiVersion: apps/v1
kind: Deployment
metadata:
  name: notely
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notely
  template:
    metadata:
      labels:
        app: notely
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: notely
          image: notely:v1
          imagePullPolicy: IfNotPresent

          env:
            - name: PORT
              value: "8080"

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          startupProbe:
            httpGet:
              path: /v1/healthz
              port: 8080
            failureThreshold: 30
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /v1/healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /v1/healthz
              port: 8080
            periodSeconds: 5
